<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Euro Foam & Mattress</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      padding: 44px 32px;
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 10px 22px;
      border-radius: 100px;
    }
    .euro-icon {
      font-size: 22px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .badge-sub {
      background: rgba(2, 132, 199, 0.18);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 30px;
      line-height: 1.25;
      margin-bottom: 14px;
      color: #ffffff;
      font-weight: 800;
    }
    h1 span {
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 34px;
    }
    .btn-botpress {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: white;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-botpress:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(2, 132, 199, 0.65);
      background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
    }
    footer {
      margin-top: 26px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Euro Logo them -->
    <div class="logo-container">
      <div class="logo-badge">
        <span class="euro-icon">★</span>
        <span class="brand-name">EURO FOAM</span>
        <span class="euro-icon">★</span>
      </div>
    </div>

    <div class="badge-sub">AIZAWL & DISTRICTS OFFICIAL DISTRIBUTION</div>
    
    <h1>Euro Foam <span>& Mattress</span></h1>
    <p>High-density foam sheets sofa siamna tur leh premium mattresses rate fel fai takin Botpress AI hmangin biak theih e.</p>

    <!-- Botpress AI Button -->
    <a href="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/09/02/12/20260902121921-I7FMMLDV.json" class="btn-botpress" target="_blank">
      💬 Chat with Euro Foam AI
    </a>
  </div>

  <footer>
    © 2026 Euro Foam Partner | Official Portal
  </footer>

</body>
</html>
